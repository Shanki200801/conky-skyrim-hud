-- Skyrim HUD widget for conky. Personal overrides go in local.lua next to this file.
conky.config = {
    alignment = 'top_middle',
    gap_x = 0, gap_y = 60,
    minimum_width = 380, maximum_width = 380, minimum_height = 205,

    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    double_buffer = true,
    update_interval = 2,
    cpu_avg_samples = 2,
    draw_shades = false, draw_outline = false, draw_borders = false,

    lua_load = '~/.config/conky/skyrim/skyrim.lua',
    lua_draw_hook_post = 'skyrim_hud',
}

-- Optional overrides, e.g. return { alignment = 'top_left', gap_x = 1135, gap_y = 1478 }
local ok, overrides = pcall(dofile, os.getenv('HOME') .. '/.config/conky/skyrim/local.lua')
if ok and type(overrides) == 'table' then
    for k, v in pairs(overrides) do conky.config[k] = v end
end

conky.text = [[ ]]
